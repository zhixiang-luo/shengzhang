packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  unrs-resolver: true
confirmModulesPurge: false
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - expo-localization@58.0.5
  - expo-router@58.0.24
verifyDepsBeforeRun: false
