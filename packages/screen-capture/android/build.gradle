plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.shengzhang.screencapture'
version = '0.1.0'

android {
  namespace 'com.shengzhang.screencapture'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
  testImplementation 'junit:junit:4.13.2'
}
