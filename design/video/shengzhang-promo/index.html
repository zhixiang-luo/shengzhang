<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>声账 · 说一句，就记好。</title>
    <script src="./assets/vendor/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #faf7f0;
      }

      .scene-shell,
      .clip {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }

      .scene-shell {
        overflow: hidden;
        background: #faf7f0;
      }

      #scene-hook {
        z-index: 16;
      }

      #scene-voice {
        z-index: 12;
      }

      #scene-trust {
        z-index: 10;
      }

      #scene-stats {
        z-index: 8;
      }

      #scene-outro {
        z-index: 6;
      }

      .transition {
        position: absolute;
        z-index: 40;
        pointer-events: none;
      }

      #ripple-one,
      #ripple-two {
        top: 1670px;
        left: 540px;
        width: 1500px;
        height: 1500px;
        margin: -750px 0 0 -750px;
        border-radius: 50%;
        background: #e89a96;
        opacity: 0;
        box-shadow:
          0 0 0 26px rgba(255, 253, 248, 0.18),
          0 0 0 54px rgba(255, 253, 248, 0.1);
      }

      #ripple-one::after,
      #ripple-two::after {
        position: absolute;
        inset: 42%;
        content: "";
        border: 4px solid rgba(255, 253, 248, 0.62);
        border-radius: 50%;
        box-shadow:
          0 0 0 70px rgba(255, 253, 248, 0.12),
          0 0 0 142px rgba(255, 253, 248, 0.08);
      }

      #paper-wipe {
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background: #faf7f0;
        box-shadow: 0 -36px 80px rgba(41, 38, 36, 0.1);
        opacity: 0;
        transform-origin: bottom;
      }

      #sage-wipe {
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        background: #e5ebe1;
        opacity: 0;
      }

      #paper-grain {
        position: absolute;
        z-index: 55;
        inset: 0;
        pointer-events: none;
        opacity: 0.038;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="27"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="scene-hook"
        class="scene-shell clip"
        data-composition-id="01-hook"
        data-composition-src="compositions/01-hook.html"
        data-start="0"
        data-duration="4.45"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-voice"
        class="scene-shell clip"
        data-composition-id="02-voice"
        data-composition-src="compositions/02-voice.html"
        data-start="3.4"
        data-duration="12.65"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-trust"
        class="scene-shell clip"
        data-composition-id="03-trust"
        data-composition-src="compositions/03-trust.html"
        data-start="15"
        data-duration="5.1"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-stats"
        class="scene-shell clip"
        data-composition-id="04-stats"
        data-composition-src="compositions/04-stats.html"
        data-start="19.4"
        data-duration="4.15"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-outro"
        class="scene-shell clip"
        data-composition-id="05-outro"
        data-composition-src="compositions/05-outro.html"
        data-start="23"
        data-duration="4"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="ripple-one" class="transition"></div>
      <div
        id="paper-wipe"
        class="transition"
        data-layout-ignore
        data-layout-allow-overlap
        data-layout-allow-occlusion
      ></div>
      <div
        id="sage-wipe"
        class="transition"
        data-layout-ignore
        data-layout-allow-overlap
        data-layout-allow-occlusion
      ></div>
      <div id="ripple-two" class="transition"></div>

      <audio
        id="soundtrack"
        data-start="0"
        data-duration="27"
        data-track-index="20"
        src="assets/audio/soundtrack.wav"
        data-volume="1"
      ></audio>

      <div id="paper-grain"></div>
    </div>

    <script>
      (function () {
        gsap.set(["#ripple-one", "#ripple-two"], { scale: 0.04, opacity: 0 });
        gsap.set("#paper-wipe", { scaleY: 0, opacity: 0 });
        gsap.set("#sage-wipe", { xPercent: 100, opacity: 0 });

        const tl = gsap.timeline({ paused: true });

        tl.set("#ripple-one", { opacity: 1, scale: 0.04 }, 3.28);
        tl.to(
          "#ripple-one",
          { scale: 1.2, duration: 0.58, ease: "power3.in" },
          3.3,
        );
        tl.set("#scene-hook", { opacity: 0 }, 3.93);
        tl.to(
          "#ripple-one",
          { opacity: 0, duration: 0.34, ease: "power2.out" },
          3.96,
        );

        tl.set("#paper-wipe", { opacity: 1, scaleY: 0, y: 0 }, 14.92);
        tl.to(
          "#paper-wipe",
          { scaleY: 1, duration: 0.5, ease: "power3.inOut" },
          14.94,
        );
        tl.set("#scene-voice", { opacity: 0 }, 15.43);
        tl.to(
          "#paper-wipe",
          { y: -1920, duration: 0.46, ease: "power3.out" },
          15.44,
        );
        tl.set("#paper-wipe", { opacity: 0 }, 15.92);

        tl.set("#sage-wipe", { opacity: 1, xPercent: 100 }, 19.32);
        tl.to(
          "#sage-wipe",
          { xPercent: 0, duration: 0.5, ease: "power3.inOut" },
          19.34,
        );
        tl.set("#scene-trust", { opacity: 0 }, 19.84);
        tl.to(
          "#sage-wipe",
          { xPercent: -100, duration: 0.46, ease: "power3.out" },
          19.86,
        );
        tl.set("#sage-wipe", { opacity: 0 }, 20.33);

        tl.set("#ripple-two", { opacity: 1, scale: 0.04 }, 22.9);
        tl.to(
          "#ripple-two",
          { scale: 1.2, duration: 0.54, ease: "power3.inOut" },
          22.92,
        );
        tl.set("#scene-stats", { opacity: 0 }, 23.47);
        tl.to(
          "#ripple-two",
          { opacity: 0, duration: 0.36, ease: "power2.out" },
          23.49,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
