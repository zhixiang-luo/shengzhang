limit_req_zone $binary_remote_addr zone=voice_req:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=voice_conn:10m;

server {
    listen 80 default_server;
    server_name _;

    root /opt/shengzhang/site;
    index index.html;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /opt/shengzhang/site;
    }

    location /v1/ {
        limit_req zone=voice_req burst=10 nodelay;
        limit_conn voice_conn 8;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 308 https://bigai.xin/shengzhang/;
    }
}

server {
    listen 80;
    server_name bigai.xin www.bigai.xin;

    location /.well-known/acme-challenge/ {
        root /opt/shengzhang/site;
    }

    location / {
        return 308 https://bigai.xin$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bigai.xin;

    ssl_certificate /etc/letsencrypt/live/bigai.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigai.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/shengzhang/site;
    index index.html;
    client_max_body_size 6m;

    location /v1/ {
        limit_req zone=voice_req burst=10 nodelay;
        limit_conn voice_conn 8;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /shengzhang {
        return 301 /shengzhang/;
    }

    location = /shengzheng {
        return 301 /shengzhang/;
    }

    location ^~ /shengzheng/ {
        return 301 /shengzhang/;
    }

    location ^~ /shengzhang/ {
        alias /opt/shengzhang/site/;
        index index.html;
    }

    location = / {
        return 302 /shengzhang/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name www.bigai.xin;

    ssl_certificate /etc/letsencrypt/live/bigai.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigai.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://bigai.xin$request_uri;
}

server {
    listen 8080;
    server_name _;

    root /opt/shengzhang/site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8787;
    server_name _;

    client_max_body_size 6m;

    location / {
        limit_req zone=voice_req burst=10 nodelay;
        limit_conn voice_conn 8;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }
}
